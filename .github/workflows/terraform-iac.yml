name: Terraform Management

on:
  workflow_dispatch:
    inputs:
      action:
        description: Acao do Terraform a ser executada
        required: true
        default: apply
        type: choice
        options:
          - apply
          - destroy

permissions:
  contents: read

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
  AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
  TF_VAR_aws_region: ${{ secrets.AWS_REGION || 'us-east-1' }}
  BUCKET_STATE: ${{ secrets.TERRAFORM_STATE_BUCKET }}

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ env.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Verify AWS and create bucket if needed
        run: |
          # Verificar se o bucket existe
          if ! aws s3api head-bucket --bucket $BUCKET_STATE 2>/dev/null; then
            echo "Bucket $BUCKET_STATE não existe. Criando..."
            aws s3api create-bucket \
              --bucket $BUCKET_STATE \
              --region $AWS_REGION \
              --create-bucket-configuration LocationConstraint=$AWS_REGION
            aws s3api put-bucket-versioning \
              --bucket $BUCKET_STATE \
              --versioning-configuration Status=Enabled
          else
            echo "Bucket $BUCKET_STATE já existe."
          fi

  security_infra:
    name: Security
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ env.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Deploy SSM Parameters
        run: |
          cd terraform/security
          terraform init -backend-config="bucket=$BUCKET_STATE" -backend-config="region=$AWS_REGION" -reconfigure
          terraform ${{ github.event.inputs.action }} -auto-approve

  data_infra:
    name: RDS and ElastiCache
    needs: [setup, security_infra]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ env.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Deploy RDS
        run: |
          cd terraform/rds
          terraform init -backend-config="bucket=$BUCKET_STATE" -backend-config="region=$AWS_REGION" -reconfigure
          terraform ${{ github.event.inputs.action }} -auto-approve
      
      - name: Deploy ElastiCache
        run: |
          cd terraform/elasticache
          terraform init -backend-config="bucket=$BUCKET_STATE" -backend-config="region=$AWS_REGION" -reconfigure
          terraform ${{ github.event.inputs.action }} -auto-approve

  ecr_serverless:
    name: ECR and Serverless
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ env.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Deploy ECR
        run: |
          cd terraform/ecr
          terraform init -backend-config="bucket=$BUCKET_STATE" -backend-config="region=$AWS_REGION" -reconfigure
          terraform ${{ github.event.inputs.action }} -auto-approve
      
      - name: Deploy Serverless
        run: |
          cd terraform/serverless
          terraform init -backend-config="bucket=$BUCKET_STATE" -backend-config="region=$AWS_REGION" -reconfigure
          terraform ${{ github.event.inputs.action }} -auto-approve

  compute_infra:
    name: EKS Cluster
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ env.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Deploy EKS
        run: |
          cd terraform/eks
          terraform init -backend-config="bucket=$BUCKET_STATE" -backend-config="region=$AWS_REGION" -reconfigure
          terraform ${{ github.event.inputs.action }} -auto-approve

  networking_infra:
    name: Networking Integrations
    needs: [data_infra, compute_infra]
    if: ${{ github.event.inputs.action == 'apply' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ env.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Mask sensitive strings in logs
        run: |
          echo "::add-mask::${{ secrets.AWS_SENSITIVE_IDENTITY }}"
      - env:
          EKS_SG: ${{ needs.compute_infra.outputs.eks_sg_id }}
        run: |
          cat <<EOF > terraform/networking/secrets.auto.tfvars
          eks_node_security_group = "$EKS_SG"
          rds_instances           = ["rds-postgres-auth", "rds-postgres-flag", "rds-postgres-targeting"]
          redis_cluster_id        = "togglemaster-redis"
          EOF
          cd terraform/networking
          terraform init -backend-config="bucket=$BUCKET_STATE" -backend-config="region=$AWS_REGION" -reconfigure
          terraform apply -auto-approve