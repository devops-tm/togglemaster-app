name: Terraform Management

on:
  workflow_dispatch:
    inputs:
      action:
        description: Ação do Terraform a ser executada
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
          - destroy

permissions:
  contents: read

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
  AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}

  TF_VAR_aws_region: ${{ secrets.AWS_REGION || 'us-east-1' }}
  TF_VAR_db_username: ${{ secrets.DB_USERNAME }}

  BUCKET_STATE: ${{ secrets.TERRAFORM_STATE_BUCKET }}

jobs:
  terraform:
    name: Terraform Production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ env.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify Terraform State Bucket
        run: |
          if ! aws s3api head-bucket --bucket "$BUCKET_STATE" 2>/dev/null; then
            echo "Bucket $BUCKET_STATE não existe. Criando..."

            aws s3api create-bucket \
              --bucket "$BUCKET_STATE" \
              --region "$AWS_REGION" \
              --create-bucket-configuration LocationConstraint="$AWS_REGION"

            aws s3api put-bucket-versioning \
              --bucket "$BUCKET_STATE" \
              --versioning-configuration Status=Enabled
          else
            echo "Bucket $BUCKET_STATE já existe."
          fi

      - name: Terraform Init
        working-directory: terraform/environments/prod
        run: |
          terraform init \
            -backend-config="bucket=$BUCKET_STATE" \
            -backend-config="region=$AWS_REGION" \
            -reconfigure

      - name: Terraform Plan
        if: github.event.inputs.action == 'plan'
        working-directory: terraform/environments/prod
        run: terraform plan -var-file="terraform.tfvars"

      - name: Terraform Apply
        if: github.event.inputs.action == 'apply'
        working-directory: terraform/environments/prod
        run: terraform apply -var-file="terraform.tfvars" -auto-approve

      - name: Terraform Destroy
        if: github.event.inputs.action == 'destroy'
        working-directory: terraform/environments/prod
        run: terraform destroy -var-file="terraform.tfvars" -auto-approve