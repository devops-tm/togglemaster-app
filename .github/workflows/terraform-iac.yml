name: Terraform Management

on:
  workflow_dispatch:
    inputs:
      action:
        description: Ação do Terraform
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
          - destroy

permissions:
  contents: read

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
  AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}

  TF_VAR_aws_region: ${{ secrets.AWS_REGION || 'us-east-1' }}
  TF_VAR_db_username: ${{ secrets.DB_USERNAME }}

  BUCKET_STATE: ${{ secrets.TERRAFORM_STATE_BUCKET }}


# ============================================================
# SECURITY
# ============================================================

jobs:

  security:
    name: Security
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ env.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: terraform/environments/prod/security
        run: |
          terraform init \
            -backend-config="bucket=$BUCKET_STATE" \
            -backend-config="key=prod/security/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -reconfigure

      - name: Terraform
        working-directory: terraform/environments/prod/security
        run: |
          terraform ${{ github.event.inputs.action }} \
            -var-file="terraform.tfvars" \
            -auto-approve


# ============================================================
# DATA
# ============================================================

  data:
    name: Data (RDS + ElastiCache)
    needs: security
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ env.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: terraform/environments/prod/data
        run: |
          terraform init \
            -backend-config="bucket=$BUCKET_STATE" \
            -backend-config="key=prod/data/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -reconfigure

      - name: Terraform
        working-directory: terraform/environments/prod/data
        run: |
          terraform ${{ github.event.inputs.action }} \
            -var-file="terraform.tfvars" \
            -auto-approve


# ============================================================
# PLATFORM
# ============================================================

  platform:
    name: Platform (ECR + SQS + DynamoDB)
    needs: security
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ env.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: terraform/environments/prod/platform
        run: |
          terraform init \
            -backend-config="bucket=$BUCKET_STATE" \
            -backend-config="key=prod/platform/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -reconfigure

      - name: Terraform
        working-directory: terraform/environments/prod/platform
        run: |
          terraform ${{ github.event.inputs.action }} \
            -var-file="terraform.tfvars" \
            -auto-approve


# ============================================================
# COMPUTE
# ============================================================

  compute:
    name: Compute (EKS)
    needs: security
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ env.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: terraform/environments/prod/compute
        run: |
          terraform init \
            -backend-config="bucket=$BUCKET_STATE" \
            -backend-config="key=prod/compute/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -reconfigure

      - name: Terraform
        working-directory: terraform/environments/prod/compute
        run: |
          terraform ${{ github.event.inputs.action }} \
            -var-file="terraform.tfvars" \
            -auto-approve


# ============================================================
# NETWORKING
# ============================================================

  networking:
    name: Networking
    needs: [data, compute]
    if: |
      always() &&
      (
        github.event.inputs.action == 'plan' ||
        github.event.inputs.action == 'apply'
      ) &&
      needs.data.result == 'success' &&
      needs.compute.result == 'success'

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ env.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: terraform/environments/prod/networking
        run: |
          terraform init \
            -backend-config="bucket=$BUCKET_STATE" \
            -backend-config="key=prod/networking/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -reconfigure

      - name: Terraform
        working-directory: terraform/environments/prod/networking
        run: |
          terraform ${{ github.event.inputs.action }} \
            -var-file="terraform.tfvars" \
            -auto-approve