name: Reusable GitOps Update

on:
  workflow_call:
    inputs:
      image-name:
        required: true
        type: string
      image-tag:
        required: true
        type: string
      registry:
        required: true
        type: string
      gitops-repo:
        required: false
        type: string
        default: 'devops-tm/togglemaster-deploy'
      gitops-branch:
        required: false
        type: string
        default: 'deploy'
    secrets:
      PERSONAL_ACCESS_TOKEN:
        required: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.gitops-repo }}
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          ref: ${{ inputs.gitops-branch }}
          path: gitops-repo

      - name: Setup Git user
        working-directory: gitops-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Determine service folder
        id: folder
        run: |
          FOLDER="${{ inputs.service-folder }}"
          if [ -z "$FOLDER" ]; then
            FOLDER="${{ inputs.image-name }}"
            FOLDER="${FOLDER#togglemaster-}"
            FOLDER="${FOLDER%-service}"
          fi
          echo "FOLDER=$FOLDER" >> $GITHUB_OUTPUT

      - name: Debug registry input
        run: |
          echo "Registry input: ${{ inputs.registry }}"
          echo "Image name: ${{ inputs.image-name }}"
          echo "Image tag: ${{ inputs.image-tag }}"
          echo "Service folder: ${{ steps.folder.outputs.FOLDER }}"

      - name: Get registry if empty
        id: get-registry
        run: |
          REGISTRY="${{ inputs.registry }}"
          if [ -z "$REGISTRY" ]; then
            echo "Registry not provided, fetching from AWS..."
            ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
            REGISTRY="$ACCOUNT_ID.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com"
          fi
          echo "registry=$REGISTRY" >> $GITHUB_OUTPUT

      - name: Validate registry
        run: |
          if [ -z "${{ steps.get-registry.outputs.registry }}" ]; then
            echo "ERROR: registry is empty. Cannot update image."
            exit 1
          fi

      - name: Update kustomization.yaml
        working-directory: gitops-repo/k8s/base/services/${{ steps.folder.outputs.FOLDER }}
        run: |
          git fetch origin
          # Garantir que está na branch correta e sincronizada
          if git ls-remote --heads origin ${{ inputs.gitops-branch }} | grep -q ${{ inputs.gitops-branch }}; then
            git checkout ${{ inputs.gitops-branch }} || git checkout -b ${{ inputs.gitops-branch }}
            git pull --rebase origin ${{ inputs.gitops-branch }}
          else
            git checkout -b ${{ inputs.gitops-branch }}
          fi

          kustomize edit set image ${{ inputs.image-name }}=${{ steps.get-registry.outputs.registry }}/${{ inputs.image-name }}:${{ inputs.image-tag }}

          git add kustomization.yaml
          git commit -m "chore: update ${{ inputs.image-name }} image tag to ${{ inputs.image-tag }}" || echo "Nenhuma alteração"

      - name: Push changes (with retry)
        working-directory: gitops-repo/k8s/base/services/${{ steps.folder.outputs.FOLDER }}
        run: |
          MAX_RETRIES=5
          RETRY_DELAY=2
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Tentativa $i de $MAX_RETRIES..."
            if git push origin ${{ inputs.gitops-branch }}; then
              echo "Push bem-sucedido!"
              break
            else
              echo "Push falhou. Tentando rebase e repetindo..."
              git pull --rebase origin ${{ inputs.gitops-branch }} 2>/dev/null || true
              sleep $RETRY_DELAY
              RETRY_DELAY=$((RETRY_DELAY * 2))
            fi
            if [ $i -eq $MAX_RETRIES ]; then
              echo "Falha após $MAX_RETRIES tentativas. Saindo com erro."
              exit 1
            fi
          done