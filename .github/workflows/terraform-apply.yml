name: Terraform Apply

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
  AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}

  TF_VAR_aws_region: ${{ secrets.AWS_REGION || 'us-east-1' }}
  TF_VAR_db_username: ${{ secrets.DB_USERNAME }}

  BUCKET_STATE: ${{ secrets.TERRAFORM_STATE_BUCKET }}


jobs:

  # ============================================================
  # PREFLIGHT
  # ============================================================

  preflight:
    name: Preflight
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ env.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      # ----------------------------------------------------------
      # SECURITY
      # ----------------------------------------------------------

      - name: Init Security
        working-directory: terraform/environments/prod/security
        run: |
          set -e

          terraform init \
            -backend-config="bucket=$BUCKET_STATE" \
            -backend-config="key=prod/security/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -reconfigure

      - name: Validate Security
        working-directory: terraform/environments/prod/security
        run: |
          set -e
          terraform validate

      - name: Reconcile Security
        working-directory: terraform/environments/prod/security
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "SECURITY PREFLIGHT"
          echo "=========================================="

          echo
          echo "Terraform State:"
          terraform state list || true

          echo
          echo "Checking AWS / Terraform drift..."

          set +e
          terraform plan \
            -refresh-only \
            -detailed-exitcode \
            -var-file="terraform.tfvars" \
            -out=security-refresh.tfplan

          STATUS=$?
          set -e

          if [ "$STATUS" -eq 1 ]; then
            echo
            echo "ERROR: Terraform refresh failed."
            exit 1
          fi

          if [ "$STATUS" -eq 2 ]; then
            echo
            echo "ERROR: Terraform State is not compliant with AWS."
            echo "Existing managed resources contain drift."
            exit 1
          fi

          echo
          echo "Security state is synchronized with AWS."

      - name: Plan Security
        working-directory: terraform/environments/prod/security
        run: |
          set -e

          terraform plan \
            -var-file="terraform.tfvars" \
            -out=security.tfplan

      # ----------------------------------------------------------
      # DATA
      # ----------------------------------------------------------

      - name: Init Data
        working-directory: terraform/environments/prod/data
        run: |
          set -e

          terraform init \
            -backend-config="bucket=$BUCKET_STATE" \
            -backend-config="key=prod/data/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -reconfigure

      - name: Validate Data
        working-directory: terraform/environments/prod/data
        run: |
          set -e
          terraform validate

      - name: Reconcile Data
        working-directory: terraform/environments/prod/data
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "DATA PREFLIGHT"
          echo "=========================================="

          STATE_BEFORE="$(mktemp)"

          terraform state list > "$STATE_BEFORE" || true

          echo
          echo "Terraform State:"
          cat "$STATE_BEFORE" || true

          # ------------------------------------------------------
          # STATE DRIFT
          # ------------------------------------------------------

          echo
          echo "Checking Terraform State against AWS..."

          set +e
          terraform plan \
            -refresh-only \
            -detailed-exitcode \
            -var-file="terraform.tfvars" \
            -out=data-refresh.tfplan

          REFRESH_STATUS=$?
          set -e

          if [ "$REFRESH_STATUS" -eq 1 ]; then
            echo
            echo "ERROR: Terraform refresh failed."
            exit 1
          fi

          if [ "$REFRESH_STATUS" -eq 2 ]; then
            echo
            echo "ERROR: Existing Terraform-managed resources"
            echo "are not synchronized with AWS."
            echo
            echo "This is considered drift."
            exit 1
          fi

          echo
          echo "Terraform State is synchronized with AWS."

          # ------------------------------------------------------
          # RDS
          # ------------------------------------------------------

          echo
          echo "------------------------------------------"
          echo "RDS RECONCILIATION"
          echo "------------------------------------------"

          DATABASES_JSON=$(
            terraform console -var-file="terraform.tfvars" \
              <<< 'jsonencode(var.databases)'
          )

          echo
          echo "Configured databases:"
          echo "$DATABASES_JSON"

          echo "$DATABASES_JSON" |
            jq -r 'to_entries[] | [.key, .value.identifier] | @tsv' |
            while IFS=$'\t' read -r DATABASE IDENTIFIER; do

              ADDRESS="module.rds.aws_db_instance.postgres[\"$DATABASE\"]"

              echo
              echo "Database:   $DATABASE"
              echo "Identifier: $IDENTIFIER"
              echo "Address:    $ADDRESS"

              if aws rds describe-db-instances \
                --db-instance-identifier "$IDENTIFIER" \
                --region "$AWS_REGION" \
                >/dev/null 2>&1; then

                echo "AWS: EXISTS"

                if terraform state list |
                  grep -Fxq "$ADDRESS"; then

                  echo "STATE: EXISTS"
                  echo "Result: resource already managed."

                else

                  echo "STATE: MISSING"
                  echo "Action: IMPORT"

                  terraform import \
                    "$ADDRESS" \
                    "$IDENTIFIER"

                  echo "Import completed."

                fi

              else

                echo "AWS: NOT FOUND"
                echo "STATE: $(terraform state list | grep -Fx "$ADDRESS" >/dev/null 2>&1 && echo EXISTS || echo MISSING)"
                echo "Result: Terraform may create this resource."

              fi

            done

          # ------------------------------------------------------
          # REDIS
          # ------------------------------------------------------

          echo
          echo "------------------------------------------"
          echo "REDIS RECONCILIATION"
          echo "------------------------------------------"

          REDIS_ID="togglemaster-redis"
          REDIS_ADDRESS="module.elasticache.aws_elasticache_cluster.redis"

          if aws elasticache describe-cache-clusters \
            --cache-cluster-id "$REDIS_ID" \
            --region "$AWS_REGION" \
            >/dev/null 2>&1; then

            echo "AWS: EXISTS"

            if terraform state list |
              grep -Fxq "$REDIS_ADDRESS"; then

              echo "STATE: EXISTS"
              echo "Result: resource already managed."

            else

              echo "STATE: MISSING"
              echo "Action: IMPORT"

              terraform import \
                "$REDIS_ADDRESS" \
                "$REDIS_ID"

              echo "Import completed."

            fi

          else

            echo "AWS: NOT FOUND"
            echo "Result: Terraform may create Redis."

          fi

          # ------------------------------------------------------
          # DYNAMODB
          # ------------------------------------------------------

          echo
          echo "------------------------------------------"
          echo "DYNAMODB RECONCILIATION"
          echo "------------------------------------------"

          DYNAMODB_NAME="togglemaster"
          DYNAMODB_ADDRESS="module.dynamodb.aws_dynamodb_table.this"

          if aws dynamodb describe-table \
            --table-name "$DYNAMODB_NAME" \
            --region "$AWS_REGION" \
            >/dev/null 2>&1; then

            echo "AWS: EXISTS"

            if terraform state list |
              grep -Fxq "$DYNAMODB_ADDRESS"; then

              echo "STATE: EXISTS"
              echo "Result: resource already managed."

            else

              echo "STATE: MISSING"
              echo "Action: IMPORT"

              terraform import \
                "$DYNAMODB_ADDRESS" \
                "$DYNAMODB_NAME"

              echo "Import completed."

            fi

          else

            echo "AWS: NOT FOUND"
            echo "Result: Terraform may create DynamoDB."

          fi

          # ------------------------------------------------------
          # SQS
          # ------------------------------------------------------

          echo
          echo "------------------------------------------"
          echo "SQS RECONCILIATION"
          echo "------------------------------------------"

          SQS_NAME="togglemaster"
          SQS_ADDRESS="module.sqs.aws_sqs_queue.this"

          if QUEUE_URL=$(
            aws sqs get-queue-url \
              --queue-name "$SQS_NAME" \
              --region "$AWS_REGION" \
              --query "QueueUrl" \
              --output text 2>/dev/null
          ); then

            echo "AWS: EXISTS"

            if terraform state list |
              grep -Fxq "$SQS_ADDRESS"; then

              echo "STATE: EXISTS"
              echo "Result: resource already managed."

            else

              echo "STATE: MISSING"
              echo "Action: IMPORT"

              terraform import \
                "$SQS_ADDRESS" \
                "$QUEUE_URL"

              echo "Import completed."

            fi

          else

            echo "AWS: NOT FOUND"
            echo "Result: Terraform may create SQS."

          fi

          echo
          echo "------------------------------------------"
          echo "DATA STATE AFTER RECONCILIATION"
          echo "------------------------------------------"

          terraform state list || true

      - name: Validate Data Configuration
        working-directory: terraform/environments/prod/data
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "DATA CONFIGURATION VALIDATION"
          echo "=========================================="

          terraform plan \
            -var-file="terraform.tfvars" \
            -out=data.tfplan

          terraform show \
            -json \
            data.tfplan > data-plan.json

          echo
          echo "Terraform configuration is valid."

      # ----------------------------------------------------------
      # PLATFORM
      # ----------------------------------------------------------

      - name: Init Platform
        working-directory: terraform/environments/prod/platform
        run: |
          set -e

          terraform init \
            -backend-config="bucket=$BUCKET_STATE" \
            -backend-config="key=prod/platform/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -reconfigure

      - name: Validate Platform
        working-directory: terraform/environments/prod/platform
        run: |
          set -e
          terraform validate

      - name: Reconcile Platform
        working-directory: terraform/environments/prod/platform
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "PLATFORM PREFLIGHT"
          echo "=========================================="

          set +e
          terraform plan \
            -refresh-only \
            -detailed-exitcode \
            -var-file="terraform.tfvars" \
            -out=platform-refresh.tfplan

          STATUS=$?
          set -e

          if [ "$STATUS" -eq 1 ]; then
            echo "ERROR: Terraform refresh failed."
            exit 1
          fi

          if [ "$STATUS" -eq 2 ]; then
            echo
            echo "ERROR: Platform State contains drift."
            exit 1
          fi

          ECR_NAME="togglemaster"
          ECR_ADDRESS='module.ecr.aws_ecr_repository.this["togglemaster"]'

          echo
          echo "------------------------------------------"
          echo "ECR RECONCILIATION"
          echo "------------------------------------------"

          if aws ecr describe-repositories \
            --repository-names "$ECR_NAME" \
            --region "$AWS_REGION" \
            >/dev/null 2>&1; then

            echo "AWS: EXISTS"

            if terraform state list |
              grep -Fxq "$ECR_ADDRESS"; then

              echo "STATE: EXISTS"

            else

              echo "STATE: MISSING"
              echo "Action: IMPORT"

              terraform import \
                "$ECR_ADDRESS" \
                "$ECR_NAME"

            fi

          else

            echo "AWS: NOT FOUND"
            echo "Result: Terraform may create ECR."

          fi

          echo
          echo "Platform State:"
          terraform state list || true

      - name: Validate Platform Configuration
        working-directory: terraform/environments/prod/platform
        run: |
          set -e

          terraform plan \
            -var-file="terraform.tfvars" \
            -out=platform.tfplan

      # ------------------------------------------------------
      # COMPUTE
      # ------------------------------------------------------

      - name: Init Compute
        working-directory: terraform/environments/prod/compute
        run: |
          set -e

          terraform init \
            -backend-config="bucket=$BUCKET_STATE" \
            -backend-config="key=prod/compute/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -reconfigure

      - name: Validate Compute
        working-directory: terraform/environments/prod/compute
        run: |
          set -e
          terraform validate

      - name: Reconcile Compute
        working-directory: terraform/environments/prod/compute
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "COMPUTE PREFLIGHT"
          echo "=========================================="

          set +e
          terraform plan \
            -refresh-only \
            -detailed-exitcode \
            -var-file="terraform.tfvars" \
            -out=compute-refresh.tfplan

          STATUS=$?
          set -e

          if [ "$STATUS" -eq 1 ]; then
            echo "ERROR: Terraform refresh failed."
            exit 1
          fi

          if [ "$STATUS" -eq 2 ]; then
            echo
            echo "ERROR: Compute State contains drift."
            exit 1
          fi

          # ------------------------------------------------------
          # EKS CONFIGURATION
          # ------------------------------------------------------

          EKS_NAME=$(
            terraform console -var-file="terraform.tfvars" \
              <<< 'var.cluster_name'
          )

          EKS_NAME=$(echo "$EKS_NAME" | tr -d '"')

          NODE_GROUP_NAME=$(
            terraform console -var-file="terraform.tfvars" \
              <<< 'var.node_group_name'
          )

          NODE_GROUP_NAME=$(echo "$NODE_GROUP_NAME" | tr -d '"')

          echo
          echo "Configured EKS:"
          echo "  Cluster:    $EKS_NAME"
          echo "  Node Group: $NODE_GROUP_NAME"

          # ------------------------------------------------------
          # EKS CLUSTER
          # ------------------------------------------------------

          EKS_ADDRESS="module.eks.aws_eks_cluster.eks"

          echo
          echo "------------------------------------------"
          echo "EKS CLUSTER RECONCILIATION"
          echo "------------------------------------------"

          if aws eks describe-cluster \
            --name "$EKS_NAME" \
            --region "$AWS_REGION" \
            >/dev/null 2>&1; then

            echo "AWS: EXISTS"

            if terraform state list |
              grep -Fxq "$EKS_ADDRESS"; then

              echo "STATE: EXISTS"

            else

              echo "STATE: MISSING"
              echo "Action: IMPORT"

              terraform import \
                "$EKS_ADDRESS" \
                "$EKS_NAME"

            fi

          else

            echo "AWS: NOT FOUND"
            echo "Result: Terraform may create EKS."

          fi

          # ------------------------------------------------------
          # EKS NODE GROUP
          # ------------------------------------------------------

          NODE_ADDRESS="module.eks.aws_eks_node_group.nodes"

          echo
          echo "------------------------------------------"
          echo "EKS NODE GROUP RECONCILIATION"
          echo "------------------------------------------"

          if aws eks describe-cluster \
            --name "$EKS_NAME" \
            --region "$AWS_REGION" \
            >/dev/null 2>&1; then

            if aws eks describe-nodegroup \
              --cluster-name "$EKS_NAME" \
              --nodegroup-name "$NODE_GROUP_NAME" \
              --region "$AWS_REGION" \
              >/dev/null 2>&1; then

              echo "AWS: EXISTS"

              if terraform state list |
                grep -Fxq "$NODE_ADDRESS"; then

                echo "STATE: EXISTS"

              else

                echo "STATE: MISSING"
                echo "Action: IMPORT"

                terraform import \
                  "$NODE_ADDRESS" \
                  "$EKS_NAME:$NODE_GROUP_NAME"

              fi

            else

              echo "AWS: NOT FOUND"
              echo "Result: Terraform may create Node Group."

            fi

          else

            echo "EKS cluster does not exist."
            echo "Node Group validation deferred."

          fi

          echo
          echo "Compute State:"
          terraform state list || true

      - name: Validate Compute Configuration
        working-directory: terraform/environments/prod/compute
        run: |
          set -e

          terraform plan \
            -var-file="terraform.tfvars" \
            -out=compute.tfplan


  # ============================================================
  # APPLY SECURITY
  # ============================================================

  apply_security:
    name: Apply Security
    needs: preflight
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ env.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: terraform/environments/prod/security
        run: |
          terraform init \
            -backend-config="bucket=$BUCKET_STATE" \
            -backend-config="key=prod/security/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -reconfigure

      - name: Terraform Plan
        working-directory: terraform/environments/prod/security
        run: |
          terraform plan \
            -var-file="terraform.tfvars" \
            -out=tfplan

      - name: Terraform Apply
        working-directory: terraform/environments/prod/security
        run: |
          terraform apply \
            -auto-approve \
            tfplan


  # ============================================================
  # APPLY DATA
  # ============================================================

  apply_data:
    name: Apply Data
    needs:
      - preflight
      - apply_security

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ env.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: terraform/environments/prod/data
        run: |
          terraform init \
            -backend-config="bucket=$BUCKET_STATE" \
            -backend-config="key=prod/data/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -reconfigure

      - name: Terraform Plan
        working-directory: terraform/environments/prod/data
        run: |
          terraform plan \
            -var-file="terraform.tfvars" \
            -out=tfplan

      - name: Terraform Apply
        working-directory: terraform/environments/prod/data
        run: |
          terraform apply \
            -auto-approve \
            tfplan


  # ============================================================
  # APPLY PLATFORM
  # ============================================================

  apply_platform:
    name: Apply Platform
    needs:
      - preflight
      - apply_security

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ env.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: terraform/environments/prod/platform
        run: |
          terraform init \
            -backend-config="bucket=$BUCKET_STATE" \
            -backend-config="key=prod/platform/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -reconfigure

      - name: Terraform Plan
        working-directory: terraform/environments/prod/platform
        run: |
          terraform plan \
            -var-file="terraform.tfvars" \
            -out=tfplan

      - name: Terraform Apply
        working-directory: terraform/environments/prod/platform
        run: |
          terraform apply \
            -auto-approve \
            tfplan


  # ============================================================
  # APPLY COMPUTE
  # ============================================================

  apply_compute:
    name: Apply Compute
    needs:
      - preflight
      - apply_security

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ env.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: terraform/environments/prod/compute
        run: |
          terraform init \
            -backend-config="bucket=$BUCKET_STATE" \
            -backend-config="key=prod/compute/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -reconfigure

      - name: Terraform Plan
        working-directory: terraform/environments/prod/compute
        run: |
          terraform plan \
            -var-file="terraform.tfvars" \
            -out=tfplan

      - name: Terraform Apply
        working-directory: terraform/environments/prod/compute
        run: |
          terraform apply \
            -auto-approve \
            tfplan


  # ============================================================
  # APPLY NETWORKING
  # ============================================================

  apply_networking:
    name: Apply Networking
    needs:
      - apply_data
      - apply_platform
      - apply_compute

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ env.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: terraform/environments/prod/networking
        run: |
          terraform init \
            -backend-config="bucket=$BUCKET_STATE" \
            -backend-config="key=prod/networking/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -reconfigure

      - name: Terraform Validate
        working-directory: terraform/environments/prod/networking
        run: |
          terraform validate

      - name: Remote State Validation
        working-directory: terraform/environments/prod/networking
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "NETWORKING REMOTE STATE VALIDATION"
          echo "=========================================="

          terraform plan \
            -refresh-only \
            -detailed-exitcode \
            -out=networking-refresh.tfplan

          STATUS=$?

          if [ "$STATUS" -eq 1 ]; then
            echo "ERROR: Networking remote state validation failed."
            exit 1
          fi

          echo "Remote states are accessible."

      - name: Terraform Plan
        working-directory: terraform/environments/prod/networking
        run: |
          set -e

          terraform plan \
            -out=tfplan

      - name: Terraform Apply
        working-directory: terraform/environments/prod/networking
        run: |
          set -e

          terraform apply \
            -auto-approve \
            tfplan