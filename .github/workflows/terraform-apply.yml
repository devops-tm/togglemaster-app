name: Terraform Apply

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
  AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
  TF_VAR_aws_region: ${{ secrets.AWS_REGION || 'us-east-1' }}
  TF_VAR_db_username: ${{ secrets.DB_USERNAME }}
  BUCKET_STATE: ${{ secrets.TERRAFORM_STATE_BUCKET }}

jobs:
  # ============================================================
  # SECURITY
  # ============================================================
  apply_security:
    name: Apply Security (SSM + KMS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ env.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: terraform/environments/prod/security
        run: |
          terraform init \
            -backend-config="bucket=$BUCKET_STATE" \
            -backend-config="key=prod/security/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -reconfigure

      - name: Terraform Apply (create/update)
        working-directory: terraform/environments/prod/security
        run: |
          terraform apply \
            -auto-approve \
            -var-file="terraform.tfvars"

  # ============================================================
  # DATA (RDS + Redis + DynamoDB + SQS) WITH RECONCILIATION
  # ============================================================
  apply_data:
    name: Apply Data with Reconciliation
    needs: apply_security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ env.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: terraform/environments/prod/data
        run: |
          terraform init \
            -backend-config="bucket=$BUCKET_STATE" \
            -backend-config="key=prod/data/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -reconfigure

      - name: Refresh State (detect and apply drift)
        working-directory: terraform/environments/prod/data
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "STEP 1: REFRESH-ONLY PLAN"
          echo "=========================================="

          # Executa refresh-only para verificar drift
          set +e
          terraform plan \
            -refresh-only \
            -detailed-exitcode \
            -var-file="terraform.tfvars" \
            -out=refresh.tfplan

          REFRESH_EXIT=$?
          set -e

          if [ $REFRESH_EXIT -eq 1 ]; then
            echo "ERROR: Terraform plan failed."
            exit 1
          fi

          if [ $REFRESH_EXIT -eq 2 ]; then
            echo "Drift detected. Applying refresh-only to update state..."
            terraform apply -auto-approve refresh.tfplan
          else
            echo "No drift detected. State is up-to-date."
          fi

      - name: Import Existing Resources
        working-directory: terraform/environments/prod/data
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "STEP 2: IMPORT EXISTING RESOURCES"
          echo "=========================================="

          # Função para importar se existir na AWS e não estiver no state
          import_if_exists() {
            local RESOURCE_ADDRESS="$1"
            local RESOURCE_ID="$2"
            local CHECK_COMMAND="$3"

            echo "Checking $RESOURCE_ADDRESS ..."

            # Verifica se já está no state usando 'terraform state show'
            # (retorna 0 se existir, 1 se não)
            if terraform state show "$RESOURCE_ADDRESS" >/dev/null 2>&1; then
              echo "  Already in state. Skipping import."
              return 0
            fi

            # Verifica se existe na AWS
            if eval "$CHECK_COMMAND" >/dev/null 2>&1; then
              echo "  Resource exists in AWS. Importing..."
              terraform import "$RESOURCE_ADDRESS" "$RESOURCE_ID"
            else
              echo "  Resource not found in AWS. Nothing to import."
            fi
          }

          # ------------------------------------------------------------
          # RDS - importa todas as instâncias com prefixo "rds-postgres-"
          # ------------------------------------------------------------
          echo "Looking for RDS instances with prefix 'rds-postgres-'..."

          # Coleta os identificadores em um array para evitar problemas de pipe
          INSTANCES=()
          while IFS=$'\t' read -r id; do
            [[ -n "$id" ]] && INSTANCES+=("$id")
          done < <(aws rds describe-db-instances \
            --region "$AWS_REGION" \
            --query 'DBInstances[?starts_with(DBInstanceIdentifier, `rds-postgres-`)].DBInstanceIdentifier' \
            --output text 2>/dev/null || echo "")

          for IDENTIFIER in "${INSTANCES[@]}"; do
            SERVICE=$(echo "$IDENTIFIER" | sed 's/^rds-postgres-//')
            ADDRESS="module.rds.aws_db_instance.postgres[\"$SERVICE\"]"
            CHECK="aws rds describe-db-instances --db-instance-identifier $IDENTIFIER --region $AWS_REGION"
            import_if_exists "$ADDRESS" "$IDENTIFIER" "$CHECK"
          done

          # ------------------------------------------------------------
          # Redis
          # ------------------------------------------------------------
          REDIS_ID="togglemaster-redis"
          REDIS_ADDRESS="module.elasticache.aws_elasticache_cluster.redis"
          CHECK="aws elasticache describe-cache-clusters --cache-cluster-id $REDIS_ID --region $AWS_REGION"
          import_if_exists "$REDIS_ADDRESS" "$REDIS_ID" "$CHECK"

          # ------------------------------------------------------------
          # DynamoDB
          # ------------------------------------------------------------
          DYNAMO_NAME="togglemaster"
          DYNAMO_ADDRESS="module.dynamodb.aws_dynamodb_table.this"
          CHECK="aws dynamodb describe-table --table-name $DYNAMO_NAME --region $AWS_REGION"
          import_if_exists "$DYNAMO_ADDRESS" "$DYNAMO_NAME" "$CHECK"

          # ------------------------------------------------------------
          # SQS
          # ------------------------------------------------------------
          SQS_NAME="togglemaster"
          SQS_ADDRESS="module.sqs.aws_sqs_queue.this"
          QUEUE_URL=$(aws sqs get-queue-url --queue-name "$SQS_NAME" --region "$AWS_REGION" --query QueueUrl --output text 2>/dev/null || echo "")
          if [ -n "$QUEUE_URL" ]; then
            CHECK="aws sqs get-queue-url --queue-name $SQS_NAME --region $AWS_REGION"
            import_if_exists "$SQS_ADDRESS" "$QUEUE_URL" "$CHECK"
          fi

          echo "Import step completed."

      - name: Plan Final Changes
        working-directory: terraform/environments/prod/data
        run: |
          echo "=========================================="
          echo "STEP 3: PLAN FINAL CHANGES"
          echo "=========================================="
          terraform plan -var-file="terraform.tfvars" -out=tfplan

      - name: Apply Final Changes
        working-directory: terraform/environments/prod/data
        run: |
          echo "=========================================="
          echo "STEP 4: APPLY FINAL CHANGES"
          echo "=========================================="
          terraform apply -auto-approve tfplan

  # ============================================================
  # PLATFORM (ECR)
  # ============================================================
  apply_platform:
    name: Apply Platform (ECR)
    needs: apply_security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ env.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: terraform/environments/prod/platform
        run: |
          terraform init \
            -backend-config="bucket=$BUCKET_STATE" \
            -backend-config="key=prod/platform/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -reconfigure

      - name: Terraform Apply (create/update)
        working-directory: terraform/environments/prod/platform
        run: |
          terraform apply \
            -auto-approve \
            -var-file="terraform.tfvars"

  # ============================================================
  # COMPUTE (EKS)
  # ============================================================
  apply_compute:
    name: Apply Compute (EKS)
    needs: apply_security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ env.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: terraform/environments/prod/compute
        run: |
          terraform init \
            -backend-config="bucket=$BUCKET_STATE" \
            -backend-config="key=prod/compute/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -reconfigure

      - name: Terraform Apply (create/update)
        working-directory: terraform/environments/prod/compute
        run: |
          terraform apply \
            -auto-approve \
            -var-file="terraform.tfvars"

  # ============================================================
  # NETWORKING (Security Groups)
  # ============================================================
  apply_networking:
    name: Apply Networking (Security Groups)
    needs: [apply_data, apply_platform, apply_compute]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ env.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: terraform/environments/prod/networking
        run: |
          terraform init \
            -backend-config="bucket=$BUCKET_STATE" \
            -backend-config="key=prod/networking/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -reconfigure

      - name: Terraform Apply (create/update)
        working-directory: terraform/environments/prod/networking
        run: |
          terraform apply \
            -auto-approve \
            -var-file="terraform.tfvars"