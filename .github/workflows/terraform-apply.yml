name: Terraform Apply

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
  AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}

  TF_VAR_aws_region: ${{ secrets.AWS_REGION || 'us-east-1' }}
  TF_VAR_db_username: ${{ secrets.DB_USERNAME }}

  BUCKET_STATE: ${{ secrets.TERRAFORM_STATE_BUCKET }}

jobs:

  apply_security:
    name: Security
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ env.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Init
        working-directory: terraform/environments/prod/security
        run: |
          terraform init \
            -backend-config="bucket=$BUCKET_STATE" \
            -backend-config="key=prod/security/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -reconfigure

      - name: Validate
        working-directory: terraform/environments/prod/security
        run: terraform validate

      - name: Plan
        working-directory: terraform/environments/prod/security
        run: terraform plan -var-file="terraform.tfvars"

      - name: Apply
        working-directory: terraform/environments/prod/security
        run: terraform apply -var-file="terraform.tfvars" -auto-approve


  apply_data:
    name: Data
    needs: apply_security
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ env.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Init
        working-directory: terraform/environments/prod/data
        run: |
          terraform init \
            -backend-config="bucket=$BUCKET_STATE" \
            -backend-config="key=prod/data/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -reconfigure

      - name: Validate
        working-directory: terraform/environments/prod/data
        run: terraform validate

      - name: Import Existing Resources
        working-directory: terraform/environments/prod/data
        shell: bash
        run: |
          set -e

          import_if_missing() {
            local address="$1"
            local resource_id="$2"

            if terraform state list | grep -Fxq "$address"; then
              echo "State OK: $address"
            else
              echo "Importing: $address -> $resource_id"
              terraform import "$address" "$resource_id"
            fi
          }

          if aws dynamodb describe-table \
            --table-name "togglemaster" \
            --region "$AWS_REGION" >/dev/null 2>&1; then

            import_if_missing \
              'module.dynamodb.aws_dynamodb_table.this' \
              'togglemaster'
          fi

          if aws sqs get-queue-url \
            --queue-name "togglemaster" \
            --region "$AWS_REGION" >/dev/null 2>&1; then

            QUEUE_URL=$(aws sqs get-queue-url \
              --queue-name "togglemaster" \
              --region "$AWS_REGION" \
              --query 'QueueUrl' \
              --output text)

            import_if_missing \
              'module.sqs.aws_sqs_queue.this' \
              "$QUEUE_URL"
          fi

      - name: Plan
        working-directory: terraform/environments/prod/data
        run: terraform plan -var-file="terraform.tfvars"

      - name: Apply
        working-directory: terraform/environments/prod/data
        run: terraform apply -var-file="terraform.tfvars" -auto-approve


  apply_platform:
    name: Platform
    needs: apply_security
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ env.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Init
        working-directory: terraform/environments/prod/platform
        run: |
          terraform init \
            -backend-config="bucket=$BUCKET_STATE" \
            -backend-config="key=prod/platform/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -reconfigure

      - name: Validate
        working-directory: terraform/environments/prod/platform
        run: terraform validate

      - name: Import Existing Resources
        working-directory: terraform/environments/prod/platform
        shell: bash
        run: |
          set -e

          import_if_missing() {
            local address="$1"
            local resource_id="$2"

            if terraform state list | grep -Fxq "$address"; then
              echo "State OK: $address"
            else
              echo "Importing: $address -> $resource_id"
              terraform import "$address" "$resource_id"
            fi
          }

          if aws ecr describe-repositories \
            --repository-names togglemaster \
            --region "$AWS_REGION" >/dev/null 2>&1; then

            import_if_missing \
              'module.ecr.aws_ecr_repository.this["togglemaster"]' \
              'togglemaster'
          fi

      - name: Plan
        working-directory: terraform/environments/prod/platform
        run: terraform plan -var-file="terraform.tfvars"

      - name: Apply
        working-directory: terraform/environments/prod/platform
        run: terraform apply -var-file="terraform.tfvars" -auto-approve


  apply_compute:
    name: Compute
    needs: apply_security
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ env.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Init
        working-directory: terraform/environments/prod/compute
        run: |
          terraform init \
            -backend-config="bucket=$BUCKET_STATE" \
            -backend-config="key=prod/compute/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -reconfigure

      - name: Validate
        working-directory: terraform/environments/prod/compute
        run: terraform validate

      - name: Import Existing Resources
        working-directory: terraform/environments/prod/compute
        shell: bash
        run: |
          set -e

          import_if_missing() {
            local address="$1"
            local resource_id="$2"

            if terraform state list | grep -Fxq "$address"; then
              echo "State OK: $address"
            else
              echo "Importing: $address -> $resource_id"
              terraform import "$address" "$resource_id"
            fi
          }

          EKS_NAME="togglemaster-eks"

          if aws eks describe-cluster \
            --name "$EKS_NAME" \
            --region "$AWS_REGION" >/dev/null 2>&1; then

            import_if_missing \
              'module.eks.aws_eks_cluster.eks' \
              "$EKS_NAME"
          fi

      - name: Plan
        working-directory: terraform/environments/prod/compute
        run: terraform plan -var-file="terraform.tfvars"

      - name: Apply
        working-directory: terraform/environments/prod/compute
        run: terraform apply -var-file="terraform.tfvars" -auto-approve


  apply_networking:
    name: Networking
    needs:
      - apply_data
      - apply_platform
      - apply_compute
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ env.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Init
        working-directory: terraform/environments/prod/networking
        run: |
          terraform init \
            -backend-config="bucket=$BUCKET_STATE" \
            -backend-config="key=prod/networking/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -reconfigure

      - name: Validate
        working-directory: terraform/environments/prod/networking
        run: terraform validate

      - name: Import Existing Resources
        working-directory: terraform/environments/prod/networking
        shell: bash
        run: |
          set -e

          import_if_missing() {
            local address="$1"
            local resource_id="$2"

            if terraform state list | grep -Fxq "$address"; then
              echo "State OK: $address"
            else
              echo "Importing: $address -> $resource_id"
              terraform import "$address" "$resource_id"
            fi
          }

          EKS_NAME="togglemaster-eks"

          if aws eks describe-cluster \
            --name "$EKS_NAME" \
            --region "$AWS_REGION" >/dev/null 2>&1; then

            if terraform state list | grep -Fxq \
              'data.terraform_remote_state.compute'; then
              echo "Remote state reference available."
            fi
          fi

      - name: Plan
        working-directory: terraform/environments/prod/networking
        run: terraform plan -var-file="terraform.tfvars"

      - name: Apply
        working-directory: terraform/environments/prod/networking
        run: terraform apply -var-file="terraform.tfvars" -auto-approve