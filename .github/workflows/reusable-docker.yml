name: Docker Pipeline

on:
  workflow_call:
    inputs:
      service-path:
        required: true
        type: string
      image-name:
        required: true
        type: string

jobs:
  docker-ecr:
    name: Docker Build and Push to ECR
    runs-on: ubuntu-latest
    outputs:
      registry: ${{ steps.ecr-login.outputs.registry }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker Image
        working-directory: ${{ inputs.service-path }}
        run: docker build -t ${{ inputs.image-name}}:latest .

      - name: Run Trivy vulnerability scanner in image mode
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          scan-ref: ${{ inputs.image-name }}
          severity: 'CRITICAL'
          exit-code: '1'
          ignore-unfixed: true  

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push Docker image to Amazon ECR
        run: |
          docker tag ${{ inputs.image-name }} ${{ steps.ecr-login.outputs.registry }}/${{ inputs.image-name }}
          docker push ${{ steps.ecr-login.outputs.registry }}/${{ inputs.image-name }}

  update-gitops:
    name: Update GitOps Repository
    needs: docker-ecr
    runs-on: ubuntu-latest
    steps:
      - name: Checkout togglemaster-deploy repository
        uses: actions/checkout@v4
        with:
          repository: togglemaster-fiapdevops/togglemaster-deploy
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Update Kubernetes manifest
        run: |
          RAW_NAME="${{ inputs.image-name }}"
          DEPLOY_FOLDER="${RAW_NAME%-service}"
          
          cd k8s/base/services/$DEPLOY_FOLDER
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          kustomize edit set image $RAW_NAME=${{ needs.docker-ecr.outputs.registry }}/$RAW_NAME:${{ github.sha }}
          
          git add kustomization.yaml
          git commit -m "chore: update $RAW_NAME image tag to ${{ github.sha }}"
          git push