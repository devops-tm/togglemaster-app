name: Docker Pipeline

on:
  workflow_call:
    inputs:
      service-path:
        required: true
        type: string
      image-name:
        required: true
        type: string

jobs:
  docker-ecr:
    name: Docker Build and Push to ECR
    runs-on: ubuntu-latest
    outputs:
      registry: ${{ steps.ecr-login.outputs.registry }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker Image
        working-directory: ${{ inputs.service-path }}
        run: docker build -t ${{ inputs.image-name }}:latest .

      - name: Run Trivy vulnerability scanner in image mode
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          scan-ref: ${{ inputs.image-name }}
          severity: 'CRITICAL'
          exit-code: '1'
          ignore-unfixed: true  

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Validate AWS credentials
        run: |
          aws sts get-caller-identity
      
      - name: Verify ECR login
        run: |
          if [ -z "${{ steps.ecr-login.outputs.registry }}" ]; then
            echo "ERROR: ECR login failed or registry empty"
            exit 1
          fi

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push Docker image to Amazon ECR
        run: |
          docker tag ${{ inputs.image-name }} ${{ steps.ecr-login.outputs.registry }}/${{ inputs.image-name }}
          docker push ${{ steps.ecr-login.outputs.registry }}/${{ inputs.image-name }}
      
      - name: Debug login output
        run: |
          echo "Registry: ${{ steps.ecr-login.outputs.registry }}"
          echo "Login succeeded: ${{ steps.ecr-login.outcome }}"

  update-gitops:
    name: Update GitOps Repository
    needs: docker-ecr
    uses: ./.github/workflows/reusable-gitops.yml
    with:
      image-name: ${{ inputs.image-name }}
      image-tag: ${{ github.sha }}
      registry: ${{ needs.docker-ecr.outputs.registry }}
      gitops-repo: 'devops-tm/togglemaster-deploy'
      gitops-branch: 'deploy'
    secrets:
      PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}