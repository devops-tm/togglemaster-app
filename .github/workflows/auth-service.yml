name: Auth Service CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: auth-service/go.sum

      - name: Build
        working-directory: ./auth-service
        run: |
          go mod download
          CGO_ENABLED=0 GOOS=linux go build -o main .

  lint-analysis:
    name: Lint Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: auth-service/go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v3
        with:
          version: latest
          working-directory: auth-service

  security-scan:
    name: Security Scan (SAST & SCA)
    needs: [build-and-test, lint-analysis]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Gosec Security Scanner (SAST)
        uses: securego/gosec@master
        with:
          args: ./auth-service/...

      - name: Run Trivy vulnerability scanner in fs mode (SCA)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './auth-service'
          severity: 'CRITICAL'
          exit-code: '1'

  docker-build:
    name: Docker Build & Image Scan
    needs: security-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build an image from Dockerfile
        working-directory: ./auth-service
        run: |
          docker build -t togglemaster/auth-service:${{ github.sha }} .

      - name: Run Trivy vulnerability scanner on image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'togglemaster/auth-service:${{ github.sha }}'
          format: 'table'
          severity: 'CRITICAL'
          exit-code: '1'

