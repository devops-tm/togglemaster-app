  apply_networking:
    name: Apply - Networking
    if: github.event.inputs.action == 'apply'
    needs:
      - apply_data
      - apply_platform
      - apply_compute

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3

