name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Digite DESTROY para confirmar"
        required: true
        type: string

permissions:
  contents: read

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
  AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}

  TF_VAR_aws_region: ${{ secrets.AWS_REGION || 'us-east-1' }}
  TF_VAR_db_username: ${{ secrets.DB_USERNAME }}

  BUCKET_STATE: ${{ secrets.TERRAFORM_STATE_BUCKET }}

jobs:

  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Confirm
        shell: bash
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "DESTROY" ]; then
            echo "ERROR: confirmação inválida."
            echo "Digite DESTROY para executar a destruição."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ env.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate State Buckets
        shell: bash
        run: |
          set -e

          if [ -z "$BUCKET_STATE" ]; then
            echo "ERROR: TERRAFORM_STATE_BUCKET não configurado."
            exit 1
          fi

          aws s3api head-bucket \
            --bucket "$BUCKET_STATE" \
            --region "$AWS_REGION"

          echo "Terraform state bucket validado."


  destroy_networking:
    name: Networking
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ env.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Init
        working-directory: terraform/environments/prod/networking
        run: |
          terraform init \
            -backend-config="bucket=$BUCKET_STATE" \
            -backend-config="key=prod/networking/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -reconfigure

      - name: Validate
        working-directory: terraform/environments/prod/networking
        run: terraform validate

      - name: State Check
        working-directory: terraform/environments/prod/networking
        shell: bash
        run: |
          set -e

          if ! terraform state list >/dev/null 2>&1; then
            echo "ERROR: Terraform state não pôde ser carregado."
            exit 1
          fi

          echo "Terraform state validado."

          terraform state list

      - name: Plan Destroy
        working-directory: terraform/environments/prod/networking
        run: |
          terraform plan \
            -destroy \
            -var-file="terraform.tfvars" \
            -out=destroy.tfplan

      - name: Destroy
        working-directory: terraform/environments/prod/networking
        run: |
          terraform apply \
            -auto-approve \
            destroy.tfplan


