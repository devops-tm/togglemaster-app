name: Terraform Destroy

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
  AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}

  TF_VAR_aws_region: ${{ secrets.AWS_REGION || 'us-east-1' }}
  TF_VAR_db_username: ${{ secrets.DB_USERNAME }}

  BUCKET_STATE: ${{ secrets.TERRAFORM_STATE_BUCKET }}


jobs:

  # ============================================================
  # COMPUTE
  # ============================================================

  destroy_compute:
    name: Destroy Compute
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ env.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: terraform/environments/prod/compute
        run: |
          set -e

          terraform init \
            -backend-config="bucket=$BUCKET_STATE" \
            -backend-config="key=prod/compute/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -reconfigure

      - name: Validate Terraform State
        working-directory: terraform/environments/prod/compute
        run: |
          set -e

          echo "Validando Terraform State..."

          terraform state list

          echo "Terraform State validado."

      - name: Terraform Destroy
        working-directory: terraform/environments/prod/compute
        run: |
          set -e

          terraform destroy \
            -var-file="terraform.tfvars" \
            -auto-approve


  # ============================================================
  # PLATFORM
  # ============================================================

  destroy_platform:
    name: Destroy Platform
    needs: destroy_compute
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ env.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: terraform/environments/prod/platform
        run: |
          set -e

          terraform init \
            -backend-config="bucket=$BUCKET_STATE" \
            -backend-config="key=prod/platform/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -reconfigure

      - name: Validate Terraform State
        working-directory: terraform/environments/prod/platform
        run: |
          set -e

          echo "Validando Terraform State..."

          terraform state list

          echo "Terraform State validado."

      - name: Terraform Destroy
        working-directory: terraform/environments/prod/platform
        run: |
          set -e

          terraform destroy \
            -var-file="terraform.tfvars" \
            -auto-approve


  # ============================================================
  # NETWORKING
  # ============================================================

  destroy_networking:
    name: Destroy Networking
    needs:
      - destroy_compute
      - destroy_platform
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ env.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: terraform/environments/prod/networking
        run: |
          set -e

          terraform init \
            -backend-config="bucket=$BUCKET_STATE" \
            -backend-config="key=prod/networking/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -reconfigure

      - name: Validate Terraform State
        working-directory: terraform/environments/prod/networking
        run: |
          set -e

          echo "Validando Terraform State..."

          terraform state list

          echo "Terraform State validado."

      - name: Terraform Destroy
        working-directory: terraform/environments/prod/networking
        run: |
          set -e

          terraform destroy \
            -var-file="terraform.tfvars" \
            -var="terraform_state_bucket=$BUCKET_STATE" \
            -auto-approve


  # ============================================================
  # DATA
  # ============================================================

  destroy_data:
    name: Destroy Data
    needs: destroy_networking
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ env.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: terraform/environments/prod/data
        run: |
          set -e

          terraform init \
            -backend-config="bucket=$BUCKET_STATE" \
            -backend-config="key=prod/data/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -reconfigure

      - name: Validate Terraform State
        working-directory: terraform/environments/prod/data
        run: |
          set -e

          echo "Validando Terraform State..."

          terraform state list

          echo "Terraform State validado."

      - name: Terraform Destroy
        working-directory: terraform/environments/prod/data
        run: |
          set -e

          terraform destroy \
            -var-file="terraform.tfvars" \
            -auto-approve


  # ============================================================
  # SECURITY
  # ============================================================

  destroy_security:
    name: Destroy Security
    needs: destroy_data
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ env.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: terraform/environments/prod/security
        run: |
          set -e

          terraform init \
            -backend-config="bucket=$BUCKET_STATE" \
            -backend-config="key=prod/security/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -reconfigure

      - name: Validate Terraform State
        working-directory: terraform/environments/prod/security
        run: |
          set -e

          echo "Validando Terraform State..."

          terraform state list

          echo "Terraform State validado."

      - name: Terraform Destroy
        working-directory: terraform/environments/prod/security
        run: |
          set -e

          terraform destroy \
            -var-file="terraform.tfvars" \
            -auto-approve