name: AI Test Generation (Gemini)

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      changed_services: ${{ steps.build-json.outputs.changed_services }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Filter changed services
        id: filter
        uses: dorny/paths-filter@v3
        with:
          base: ${{ github.event.pull_request.base.sha || github.event.before }}
          filters: |
            auth:
              - 'src/auth-service/**'
            flag:
              - 'src/flag-service/**'
            targeting:
              - 'src/targeting-service/**'
            evaluation:
              - 'src/evaluation-service/**'
            analytics:
              - 'src/analytics-service/**'

      - name: Build JSON of changed services
        id: build-json
        run: |
          SERVICES='[]'
          if [ "${{ steps.filter.outputs.auth }}" == "true" ]; then
            SERVICES=$(echo "$SERVICES" | jq -c '. + ["auth"]')
          fi
          if [ "${{ steps.filter.outputs.flag }}" == "true" ]; then
            SERVICES=$(echo "$SERVICES" | jq -c '. + ["flag"]')
          fi
          if [ "${{ steps.filter.outputs.targeting }}" == "true" ]; then
            SERVICES=$(echo "$SERVICES" | jq -c '. + ["targeting"]')
          fi
          if [ "${{ steps.filter.outputs.evaluation }}" == "true" ]; then
            SERVICES=$(echo "$SERVICES" | jq -c '. + ["evaluation"]')
          fi
          if [ "${{ steps.filter.outputs.analytics }}" == "true" ]; then
            SERVICES=$(echo "$SERVICES" | jq -c '. + ["analytics"]')
          fi
          echo "changed_services=$SERVICES" >> $GITHUB_OUTPUT
          echo "Changed services: $SERVICES"

  generate-tests:
    name: Generate Tests for Changed Services
    needs: detect-changes
    if: needs.detect-changes.outputs.changed_services != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.changed_services) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Setup Go (para serviços Go)
        if: matrix.service != 'analytics'  # analytics é Python
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install dependencies
        run: |
          pip install google-genai

      - name: Find main file and generate tests
        id: generate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          SERVICE_PATH="src/${{ matrix.service }}-service"
          
          # Procura por arquivos principais
          MAIN_FILE=""
          # Go: procura por main.go ou arquivos .go na raiz (exceto *_test.go)
          if [ -d "$SERVICE_PATH" ]; then
            MAIN_FILE=$(find "$SERVICE_PATH" -maxdepth 2 -type f -name "main.go" -o -name "app.go" | head -1)
            if [ -z "$MAIN_FILE" ]; then
              MAIN_FILE=$(find "$SERVICE_PATH" -type f -name "*.go" ! -name "*_test.go" | head -1)
            fi
          fi
          
          # Python: procura por app.py ou main.py
          if [ -z "$MAIN_FILE" ]; then
            MAIN_FILE=$(find "$SERVICE_PATH" -type f -name "app.py" -o -name "main.py" | head -1)
            if [ -z "$MAIN_FILE" ]; then
              MAIN_FILE=$(find "$SERVICE_PATH" -type f -name "*.py" ! -name "__init__.py" ! -name "test_*.py" | head -1)
            fi
          fi
          
          if [ -z "$MAIN_FILE" ]; then
            echo "ERROR: Nenhum arquivo fonte encontrado em $SERVICE_PATH"
            find "$SERVICE_PATH" -type f \( -name "*.go" -o -name "*.py" \) | head -10
            exit 1
          fi
          
          echo "main_file=$MAIN_FILE" >> $GITHUB_OUTPUT
          echo "📄 Gerando testes para $MAIN_FILE"
          
          # Detecta linguagem automaticamente
          python scripts/ai_test_generator.py "$MAIN_FILE" -o "tests/test_${{ matrix.service }}_generated"

      - name: Install test dependencies (Python)
        if: matrix.service == 'analytics'
        run: |
          pip install pytest pytest-cov

      - name: Install test dependencies (Go)
        if: matrix.service != 'analytics'
        run: |
          go mod download || true
          go install github.com/stretchr/testify/assert@latest

      - name: Run generated tests
        id: run-tests
        continue-on-error: true
        run: |
          TEST_FILE="tests/test_${{ matrix.service }}_generated"
          if [ "${{ matrix.service }}" == "analytics" ]; then
            # Python
            if [ -f "${TEST_FILE}.py" ]; then
              pytest "${TEST_FILE}.py" -v --tb=short || echo "⚠️ Testes falharam"
            else
              echo "Nenhum teste gerado"
            fi
          else
            # Go
            if [ -f "${TEST_FILE}.go" ]; then
              go test -v "${TEST_FILE}.go" || echo "⚠️ Testes falharam"
            else
              echo "Nenhum teste gerado"
            fi
          fi

      - name: Upload generated tests artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ matrix.service }}
          path: tests/test_${{ matrix.service }}_generated.*

  comment-pr:
    name: Comment PR with results
    if: github.event_name == 'pull_request'
    needs: [detect-changes, generate-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Build comment body
        id: build-comment
        run: |
          SERVICES="${{ needs.detect-changes.outputs.changed_services }}"
          COMMENT="## 🤖 AI Test Generation (Gemini)\n\n"
          if [ "$SERVICES" == "[]" ]; then
            COMMENT+="Nenhum serviço foi alterado nesta PR."
          else
            COMMENT+="**Serviços modificados:** $SERVICES\n\n"
            for service in $(echo "$SERVICES" | jq -r '.[]'); do
              TEST_FILE=$(find artifacts/tests-${service} -type f 2>/dev/null | head -1)
              if [ -f "$TEST_FILE" ]; then
                LINES=$(wc -l < "$TEST_FILE")
                EXT=${TEST_FILE##*.}
                COMMENT+="- **${service}** (${EXT}): ✅ Testes gerados (${LINES} linhas)\n"
              else
                COMMENT+="- **${service}**: ❌ Nenhum teste gerado\n"
              fi
            done
          fi
          COMMENT+="\n> ⚠️ **Os testes foram gerados por IA e podem conter erros. Revise antes de mesclar.**"
          echo "comment_body=$COMMENT" >> $GITHUB_OUTPUT

      - name: Find existing comment
        uses: peter-evans/find-comment@v3
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body-includes: 'AI Test Generation (Gemini)'

      - name: Create or update comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          edit-mode: replace
          body: ${{ steps.build-comment.outputs.comment_body }}