name: Targeting Service CI

on:
  push:
    branches: [ main ]
    paths:
      - 'targeting-service/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'targeting-service/**'

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: 'targeting-service/.python-version'
          cache: 'pip'

      - name: Install dependencies
        working-directory: ./targeting-service
        run: |
          pip install --no-cache-dir -r requirements.txt

  lint-analysis:
    name: Lint Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: 'targeting-service/.python-version'

      - name: Install Flake8
        run: pip install flake8

      - name: Run Flake8
        working-directory: ./targeting-service
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  security-scan:
    name: Security Scan (SAST & SCA)
    needs: [build-and-test, lint-analysis]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: 'targeting-service/.python-version'

      - name: Install Bandit for SAST
        run: pip install bandit

      - name: Run Bandit Security Scanner
        working-directory: ./targeting-service
        run: bandit -r . -lll -ii -x ./tests

      - name: Run Trivy vulnerability scanner in fs mode
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './targeting-service'
          severity: 'CRITICAL'
          exit-code: '1'
          ignore-unfixed: true

  docker-build:
    name: Docker Build & Image Scan
    needs: security-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build an image from Dockerfile
        working-directory: ./targeting-service
        run: |
          docker build -t togglemaster/targeting-service:${{ github.sha }} .
          docker save togglemaster/targeting-service:${{ github.sha }} -o /tmp/targeting-service.tar

      - name: Load image for Trivy
        run: |
          docker load -i /tmp/targeting-service.tar

      - name: Run Trivy vulnerability scanner on image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'togglemaster/targeting-service:${{ github.sha }}'
          format: 'table'
          severity: 'CRITICAL'
          exit-code: '1'
          ignore-unfixed: true